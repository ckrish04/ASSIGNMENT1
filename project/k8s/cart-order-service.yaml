apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-order-service
  template:
    metadata:
      labels:
        app: cart-order-service
    spec:
      containers:
        - name: cart-order-service
          image: quickcommerce/cart-order-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
            - name: DB_NAME
              value: "cart_order_db"
            - name: JWT_SECRET
              value: "super-secret-key-change-in-prod"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8002"
            - name: DELIVERY_SERVICE_URL
              value: "http://delivery-service:8004"
---
apiVersion: v1
kind: Service
metadata:
  name: cart-order-service
spec:
  selector:
    app: cart-order-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
